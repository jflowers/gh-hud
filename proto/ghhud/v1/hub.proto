syntax = "proto3";

// The gh-hud hub API. A hub runs gh-hud's refresh loops, the agent
// dispatcher and the fleet; clients (the TUI, the Mac and Android apps)
// read its state as snapshots and send it commands.
//
// Clients name things by stable keys: items by URL, runs and sessions by
// ID, queue entries by task and ref ("owner/repo#N"). State changes
// arrive in the next snapshot; commands return only what the caller
// needs at once.
//
// Open sets are strings, so a newer hub can add values without breaking
// older clients: tasks ("rebase", "ci", "feedback", "review", "issue"),
// run statuses, stage kinds, and fleet states. Closed sets are enums.
package ghhud.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jflowers/gh-hud/internal/api/gen/ghhud/v1;ghhudv1";
option java_multiple_files = true;
option java_package = "io.github.jflowers.ghhud.api.v1";

service HubService {
  // GetSnapshot returns the hub's current state.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Subscribe streams the current snapshot, then every change, and the
  // events (notices and alerts) that happen meanwhile. A slow reader
  // skips intermediate snapshots but always gets the newest.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Refresh asks for a refresh now; it coalesces with work in flight.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Dispatch. These fail with FAILED_PRECONDITION when dispatch is off,
  // and the hub refuses changes while another gh-hud owns dispatch.
  rpc MenuChoices(MenuChoicesRequest) returns (MenuChoicesResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  // ItemChoices looks up an issue or PR you name, in the latest refresh
  // or else on GitHub, and lists every task that fits it (MenuChoices
  // lists only those its state calls for, and only for refreshed items).
  // Dispatch then takes the item's URL. INVALID_ARGUMENT when ref isn't
  // an issue or PR.
  rpc ItemChoices(ItemChoicesRequest) returns (ItemChoicesResponse);
  rpc Reinspect(ReinspectRequest) returns (ReinspectResponse);
  // PruneBranches finds the dispatch checkouts' branches whose PR is
  // merged or closed, and your forks' (gh-hud branches); with apply it
  // deletes them and fast-forwards the forks' default branches.
  rpc PruneBranches(PruneBranchesRequest) returns (PruneBranchesResponse);

  // Your queue of agent tasks.
  rpc QueueChoices(QueueChoicesRequest) returns (QueueChoicesResponse);
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Unqueue(UnqueueRequest) returns (UnqueueResponse);
  rpc MoveQueued(MoveQueuedRequest) returns (MoveQueuedResponse);

  // Supervisor proposals (Snapshot.cases), by proposal id.
  rpc ApproveProposal(ApproveProposalRequest) returns (ApproveProposalResponse);
  rpc RejectProposal(RejectProposalRequest) returns (RejectProposalResponse);

  // Epics (Snapshot.epics), by ref (owner/repo#N).
  rpc EnrollEpic(EnrollEpicRequest) returns (EnrollEpicResponse);
  rpc ApproveEpic(ApproveEpicRequest) returns (ApproveEpicResponse);
  rpc DropEpic(DropEpicRequest) returns (DropEpicResponse);
  rpc RereadEpic(RereadEpicRequest) returns (RereadEpicResponse);
  // ClearEpicGate says a piece's gate holds: it no longer waits on it.
  rpc ClearEpicGate(ClearEpicGateRequest) returns (ClearEpicGateResponse);
  // FinishEpic posts a finished epic's summary on it, as you, and closes
  // it as completed (gh-hud#22). Every piece must be done or dropped.
  rpc FinishEpic(FinishEpicRequest) returns (FinishEpicResponse);

  // Viewers. They open a terminal window on the hub's machine.
  rpc Watch(WatchRequest) returns (WatchResponse);
  rpc WatchRun(WatchRunRequest) returns (WatchRunResponse);
  rpc OpenTranscript(OpenTranscriptRequest) returns (OpenTranscriptResponse);

  // Viewers for apps on other devices: the content instead of a window.
  // ReadPane returns the end of a live agent's herdr pane, as Watch shows
  // it; Transcript a run's opencode session as messages. Read-only: a
  // hub that follows another gh-hud serves them too.
  rpc ReadPane(ReadPaneRequest) returns (ReadPaneResponse);
  rpc Transcript(TranscriptRequest) returns (TranscriptResponse);

  // FleetControl drives the GitOps rollout; FAILED_PRECONDITION when the
  // fleet is off.
  rpc FleetControl(FleetControlRequest) returns (FleetControlResponse);
  // DeweyReindex starts, or cancels, a pass that reindexes the Dewey
  // vaults on a fleet machine, or on every one (#139): the ones Dewey
  // says need it (#138), or every one with force. A pass goes vault by
  // vault, skipping busy ones; its progress is FleetMachine.dewey_pass.
  // FAILED_PRECONDITION when the fleet is off; refused when
  // [dispatch] dewey_reindex is "off", a pass already runs there, or this
  // hub doesn't own dispatch.
  rpc DeweyReindex(DeweyReindexRequest) returns (DeweyReindexResponse);

  // CheckoutAction starts one action on one fleet checkout from the
  // Workspaces list (#172): fast-forward it, open its learnings PRs, save
  // its leftover work to a draft PR, keep it up now, reindex its Dewey
  // vault, or discard its uncommitted changes. It runs in the background;
  // the outcome is the checkout's last upkeep or reindex and an event.
  // Refused when this hub doesn't own dispatch, the checkout isn't a fleet
  // checkout in the last Workspaces read, or its machine's slot is taken.
  rpc CheckoutAction(CheckoutActionRequest) returns (CheckoutActionResponse);

  // ToolkitRollout starts rolling a tool release out (issue #75);
  // ToolkitControl drives rollouts. FAILED_PRECONDITION when the toolkit
  // is off.
  rpc ToolkitRollout(ToolkitRolloutRequest) returns (ToolkitRolloutResponse);
  rpc ToolkitControl(ToolkitControlRequest) returns (ToolkitControlResponse);
}

message GetSnapshotRequest {}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message SubscribeRequest {
  // native_notifications says this client shows alerts as notifications
  // itself, so the hub stops posting its own (osascript) ones while the
  // subscription lasts. Alerts still arrive as events either way.
  bool native_notifications = 1;
}

message SubscribeResponse {
  oneof msg {
    Snapshot snapshot = 1;
    Event event = 2;
  }
}

message RefreshRequest {
  RefreshTarget target = 1;
}

enum RefreshTarget {
  REFRESH_TARGET_UNSPECIFIED = 0;
  REFRESH_TARGET_GITHUB = 1; // fetch GitHub
  REFRESH_TARGET_AGENTS = 2; // sessions, runs and slot usage
  REFRESH_TARGET_WORKSPACES = 3; // checkout health on every machine
}

message RefreshResponse {}

message MenuChoicesRequest {
  string url = 1;
}

message MenuChoicesResponse {
  repeated MenuChoice choices = 1;
  // Why nothing can start, in one line, when choices is empty: the
  // human-gate label, an agent already running on it (and where), no
  // command set, no machine free, no checkout, or every checkout busy.
  string why = 2;
}

// MenuChoice is a task that can start on an item now, and where.
message MenuChoice {
  string task = 1;
  string cmd = 2;
  // "workspace" locally, "machine:workspace" remotely.
  string target = 3;
  // The item's state calls for this task (always, from MenuChoices).
  bool suggested = 4;
}

message ItemChoicesRequest {
  // A GitHub issue or pull request URL (anything after the number is
  // ignored), or "owner/repo#123".
  string ref = 1;
}

message ItemChoicesResponse {
  // The item named, as the dashboard would show it; send its url to
  // Dispatch.
  Item item = 1;
  // Suggested tasks first. Empty when none can start; why says why.
  repeated MenuChoice choices = 2;
  // Why nothing can start, in one line, when choices is empty (see
  // MenuChoicesResponse.why).
  string why = 3;
}

message DispatchRequest {
  string task = 1;
  string url = 2;
}

message DispatchResponse {
  // Where the run started.
  string task = 1;
  string ref = 2;
  string workspace = 3;
  string machine = 4; // "" is the hub's machine
  string runner = 5; // "herdr" or "local"
  string dir = 6;
}

message ReinspectRequest {
  string run_id = 1;
}

message ReinspectResponse {
  Run run = 1;
}

message PruneBranchesRequest {
  bool apply = 1;
}

message PruneBranchesResponse {
  repeated BranchPrune local = 1;
  repeated BranchPrune remote = 2; // the head repo's copies (repo is the head repo)
  int32 kept = 3; // branches with an open PR, or none
  repeated string errors = 4;
  repeated ForkSync forks = 5; // forks whose default branch is behind its parent's
  // Worktree records whose folders were gone, dropped (or to drop) by
  // `git worktree prune`: "machine:workspace: what git said".
  repeated string worktrees = 6;
}

// ForkSync is a fork's default branch against its parent's.
message ForkSync {
  string repo = 1; // the fork, owner/name
  string branch = 2;
  int32 behind = 3; // parent commits the fork lacks
  int32 ahead = 4; // fork commits the parent lacks (then it isn't synced)
  string action = 5; // "synced", "would sync", or "kept: why"
}

// BranchPrune is one branch whose PR is done.
message BranchPrune {
  string machine = 1; // "" is the hub's machine
  string workspace = 2;
  string repo = 3;
  string branch = 4;
  string pr = 5; // owner/repo#N
  string state = 6; // "merged" or "closed"
  string action = 7; // "pruned", "would prune", or "kept: why"
}

message QueueChoicesRequest {
  string url = 1;
}

message QueueChoicesResponse {
  repeated string tasks = 1;
}

message EnqueueRequest {
  string task = 1;
  string url = 2;
}

message EnqueueResponse {
  int64 position = 1; // 1 is first
}

message UnqueueRequest {
  string task = 1;
  string ref = 2;
}

message UnqueueResponse {}

message MoveQueuedRequest {
  string task = 1;
  string ref = 2;
  int64 delta = 3; // negative is earlier
}

message MoveQueuedResponse {
  int64 index = 1; // 0 is first
}

message ApproveProposalRequest {
  string id = 1;
}

message ApproveProposalResponse {}

message RejectProposalRequest {
  string id = 1;
}

message RejectProposalResponse {}

message EnrollEpicRequest {
  string target = 1; // an issue URL or owner/repo#N
}

message EnrollEpicResponse {
  string ref = 1;
}

message ApproveEpicRequest {
  string ref = 1;
  string plan_id = 2; // the plan seen; empty approves the current one
}

message ApproveEpicResponse {}

message DropEpicRequest {
  string ref = 1;
}

message DropEpicResponse {}

message RereadEpicRequest {
  string ref = 1;
}

message RereadEpicResponse {}

message ClearEpicGateRequest {
  string ref = 1;   // the epic
  string piece = 2; // owner/repo#N, or #N in the epic's repo
}

message ClearEpicGateResponse {}

message FinishEpicRequest {
  string ref = 1;
  string plan_id = 2; // the plan seen finished; empty finishes the current one
}

message FinishEpicResponse {}

message WatchRequest {
  string session_id = 1;
}

message WatchResponse {}

message WatchRunRequest {
  string run_id = 1;
}

message WatchRunResponse {}

message OpenTranscriptRequest {
  string run_id = 1;
}

message OpenTranscriptResponse {}

message ReadPaneRequest {
  // A run's pane, while it runs (run IDs are unique; session IDs repeat
  // across runs), or else a session's.
  string run_id = 1;
  string session_id = 2;
  int32 lines = 3; // the pane's last lines, 1 to 2000; 0 asks for 200
}

message ReadPaneResponse {
  string text = 1;
}

message TranscriptRequest {
  string run_id = 1;
  int32 last = 2; // the last messages, 1 to 500; 0 asks for 100
}

message TranscriptResponse {
  repeated TranscriptMessage messages = 1; // oldest first
  int32 omitted = 2; // earlier messages left out
}

// TranscriptMessage is one turn of an opencode session.
message TranscriptMessage {
  string role = 1; // "user" or "assistant"
  google.protobuf.Timestamp created = 2;
  repeated TranscriptPart parts = 3;
}

// TranscriptPart is what a message said, or a tool it called. Reasoning
// and bookkeeping parts are left out.
message TranscriptPart {
  string text = 1; // the words; for a tool, what it did ("go test ./...")
  string tool = 2; // the tool's name, for a tool call
  bool failed = 3; // a tool call that errored
}

message FleetControlRequest {
  FleetAction action = 1;
}

enum FleetAction {
  FLEET_ACTION_UNSPECIFIED = 0;
  FLEET_ACTION_PAUSE = 1;
  FLEET_ACTION_RESUME = 2;
  FLEET_ACTION_APPLY_NOW = 3; // poll the target now
  FLEET_ACTION_SKIP_WAIT = 4; // apply without waiting for agents to drain
  FLEET_ACTION_RETRY = 5; // retry the failed machine
}

message FleetControlResponse {}

message DeweyReindexRequest {
  string machine = 1; // a fleet machine ("local" is the hub); "" with all
  bool all = 2; // every fleet machine
  bool cancel = 3; // cancel the running pass instead of starting one
  // force reindexes every vault, not just the ones whose index check
  // (Dewey's own verdict) says so.
  bool force = 4;
}

message DeweyReindexResponse {
  repeated string machines = 1; // where a pass started (or was cancelled)
  repeated string refused = 2; // with all: "<machine>: <why>" for the rest
}

message CheckoutActionRequest {
  string machine = 1; // CheckoutHealth.machine ("" is the hub)
  string dir = 2; // CheckoutHealth.dir
  CheckoutActionKind action = 3;
}

enum CheckoutActionKind {
  CHECKOUT_ACTION_KIND_UNSPECIFIED = 0;
  CHECKOUT_ACTION_KIND_PULL = 1; // fast-forward the default branch
  CHECKOUT_ACTION_KIND_LEARNINGS = 2; // open the learnings PRs
  CHECKOUT_ACTION_KIND_SAVE = 3; // leftover work to a draft PR from the fork
  CHECKOUT_ACTION_KIND_UPKEEP = 4; // a full upkeep now, acting
  CHECKOUT_ACTION_KIND_REINDEX = 5; // reindex the checkout's Dewey vault
  CHECKOUT_ACTION_KIND_DISCARD = 6; // throw the uncommitted changes away
}

message CheckoutActionResponse {
  string started = 1; // one line: what started
}

message ToolkitRolloutRequest {
  string tool = 1;
  string version = 2; // "" for the latest release
}

message ToolkitRolloutResponse {
  string id = 1; // tool@version
}

message ToolkitControlRequest {
  ToolkitAction action = 1;
  string id = 2; // the rollout; unused for CHECK
}

enum ToolkitAction {
  TOOLKIT_ACTION_UNSPECIFIED = 0;
  TOOLKIT_ACTION_CANCEL = 1; // stop a rollout; its PRs stay open
  TOOLKIT_ACTION_RETRY = 2; // resume a failed or cancelled rollout
  TOOLKIT_ACTION_DISMISS = 3; // forget a finished rollout
  TOOLKIT_ACTION_CHECK = 4; // check releases and versions now
}

message ToolkitControlResponse {}

// Snapshot is the hub's state at one moment.
message Snapshot {
  // seq increases with every publish; clients drop older snapshots.
  uint64 seq = 1;

  FetchResult result = 2; // unset until the first fetch completes
  google.protobuf.Timestamp fetched_at = 3;
  bool fetching = 4;
  // fetch_error is fatal: the GitHub user could not be resolved.
  string fetch_error = 5;

  // dispatch is true when the hub has a dispatcher.
  bool dispatch = 6;
  // follower is the owning gh-hud's pid when this hub only follows ("?"
  // when unknown); "" when it owns dispatch.
  string follower = 7;
  repeated Session sessions = 8;
  repeated Run runs = 9; // newest first
  repeated MachineUsage usage = 10;
  google.protobuf.Timestamp agents_at = 11;
  // stages is each item's pipeline stage, keyed by item URL.
  map<string, Stage> stages = 12;
  // plan is what agents work on next, in start order; queue is your
  // queue, first to start first.
  repeated PlanRow plan = 13;
  repeated QueueEntry queue = 14;

  repeated CheckoutHealth workspaces = 15;
  google.protobuf.Timestamp workspaces_at = 16;
  bool workspaces_loading = 17;

  FleetSnapshot fleet = 18; // unset when the fleet is off

  // cases are what the rules can't settle, with the supervisor's
  // decisions, runs and proposals.
  repeated Case cases = 19;
  // epics are the enrolled epics with their plans and status.
  repeated Epic epics = 20;
  // config_warnings are problems with config.toml that didn't stop it
  // loading, such as keys nothing reads.
  repeated string config_warnings = 21;
  ToolkitSnapshot toolkit = 22; // unset when the toolkit is off
}

message FetchResult {
  repeated Item items = 1; // attention-ranked
  repeated SectionError errors = 2;
  google.protobuf.Duration took = 3;
  google.protobuf.Timestamp fetched_at = 4;
  string user = 5;
  // Sections whose search matched more than they read (#184): the least
  // recently updated matches aren't here, and nothing acts on them.
  repeated SectionCut cut_short = 6;
}

// SectionCut is a dashboard section its search cut short.
message SectionCut {
  string section = 1;
  int64 shown = 2;
  int64 total = 3;
}

// SectionError is a dashboard section that failed to load.
message SectionError {
  string section = 1;
  string message = 2;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_NOTE = 1; // a notification not backed by a fetched PR/issue
  ITEM_KIND_PR = 2;
  ITEM_KIND_ISSUE = 3;
  ITEM_KIND_RUN = 4; // an Actions run
}

enum CIState {
  CI_STATE_UNSPECIFIED = 0;
  CI_STATE_BLANK = 1; // no CI column
  CI_STATE_NONE = 2; // no checks at all
  CI_STATE_OK = 3;
  CI_STATE_PENDING = 4;
  CI_STATE_FAIL = 5;
}

// Item is one row on the dashboard: a PR, issue, Actions run or
// notification.
message Item {
  ItemKind kind = 1;
  // categories is a bitmask of dashboard sections: 1 review requested,
  // 2 mine, 4 issues, 8 CI, 16 notifications, 32 ready for a
  // maintainer, 64 ready for an agent review.
  uint32 categories = 2;
  string url = 3;
  string repo = 4; // owner/name
  int64 num = 5;
  string title = 6;

  string author = 7;
  bool draft = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  CIState ci = 11; // overall checks
  CIState codecov = 12; // codecov/patch
  // review, bot_review and merge are the TUI's glyphs for now: the
  // human and bot review states, and the merge state ("⚠️" conflict,
  // " " ok, "?" unknown).
  string review = 13;
  string bot_review = 14;
  string merge = 15;
  int64 threads = 16; // unresolved review threads opened by humans
  int64 bot_threads = 17; // ... and by bots
  int64 threads_open = 44; // the human ones whose last comment isn't mine
  bool threads_more = 45; // more threads than the dashboard reads; threads may undercount

  string last_actor = 18;
  string waiting_on = 19; // "me", "them" or ""
  bool tagged = 20; // you are a requested reviewer or assignee
  bool other_approved = 21; // a maintainer other than you approved
  bool my_approval = 22; // your latest review is an approval
  bool bot_review_due = 23;

  repeated string reasons = 24; // notification reasons

  string node_id = 25;
  string head_oid = 26;
  string merge_state = 27; // GitHub mergeStateStatus
  string review_decision = 28;
  int64 required_reviews = 29;
  bool auto_merge_on = 30;
  bool auto_merge_allowed = 31;
  repeated string labels = 32;

  repeated string failing_checks = 33;
  bool checks_required = 34;
  repeated string required_fails = 35;
  repeated string base_failing = 36;
  repeated string base_passing = 37;
  string base_oid = 38;

  int64 size = 39; // lines added plus removed
  repeated string files = 40;

  string head_branch = 41;
  string run_branch = 42;
  string run_event = 43;
  // The head's cancelled check runs: CI shows them as passing, but GitHub
  // blocks the merge on them (#186).
  repeated string cancelled_checks = 46;
}

// Session is an agent session on some machine.
message Session {
  string id = 1;
  string title = 2;
  string directory = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool running = 5;
  bool failed = 6;
  bool unknown = 7;
  string note = 8;
  string task = 9;
  string log = 10;
  string workspace = 11;
  string ref = 12;
  string machine = 13; // "" is the hub's machine
  string state = 14;
  string pane_id = 15;
  string ws_id = 16;
  bool blocked = 17;
  google.protobuf.Timestamp blocked_since = 18;
  string run_id = 19;
}

// Run is one dispatch: its status and what it did.
message Run {
  string id = 1;
  string task = 2;
  string ref = 3;
  string repo = 4;
  int64 num = 5;
  string machine = 6;
  string workspace = 7;
  string dir = 8;
  // status: running, blocked, ok, failed, left-work or unknown.
  string status = 9;
  bool auto = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12; // unset while running
  string session_id = 13;
  string pane_id = 14;
  string ws_id = 15;
  string log = 16;
  string reason = 17;
  string summary = 18;
  repeated string left = 19;
  repeated string pushed = 20;
  string branch = 21;
  bool cleaned = 22;
  string fingerprint = 23;
  // human_needed: the agent handed a decision to a person and stopped
  // (auto-question's escalation); status is failed.
  bool human_needed = 24;
  // index_health: the checkout's Dewey index after a clean run: "ok",
  // "reindex needed: <reasons>", "check failed: <err>", a machine
  // problem, or a skip. Empty when the checkout isn't a Dewey vault.
  string index_health = 25;
  // opencode: the machine's `opencode --version` when the run started;
  // empty when unknown.
  string opencode = 26;
  // finding: what a ci run found (blocked by the base branch, fixed by
  // another PR) while it's recorded; finding_note says why there is none
  // (refused, or the supervisor found nothing); finding_pending that the
  // supervisor is reading the run (#180).
  Finding finding = 27;
  string finding_note = 28;
  bool finding_pending = 29;
}

// Finding is what a ci run found, with the PR state it holds for: it
// lapses when the head, the base commit or the failing checks change.
message Finding {
  string kind = 1; // open set: blocked_by_base, fixed_by
  string check = 2; // blocked_by_base: the check the base branch breaks
  int64 pr = 3; // fixed_by: the PR that fixes it
  string why = 4;
  string by = 5; // agent or supervisor
  string head = 6;
  string base = 7;
  repeated string checks = 8;
}

message MachineUsage {
  string name = 1;
  int64 used = 2;
  int64 max = 3;
  bool ok = 4; // reachable and enabled
  // opencode: the machine's opencode version as last polled (at most every
  // few minutes), e.g. "1.14.2"; empty when not known.
  string opencode = 5;
}

// Stage is a PR's position in the auto pipeline.
message Stage {
  // kind: "" none, running, next, wait, you, merge.
  string kind = 1;
  string task = 2;
  string reason = 3;
}

message PlanRow {
  Item item = 1;
  string task = 2;
  Stage stage = 3;
  int64 queued = 4; // position in your queue (1 first); 0 for auto rows
  string note = 5;
  bool missing = 6; // queued, but not in the latest refresh
  string epic = 7;   // the epic a piece's row comes from (owner/repo#N)
  string rule = 8;   // the by_label rule (its label) that picks the command
}

message QueueEntry {
  string ref = 1;
  string task = 2;
  string title = 3;
  google.protobuf.Timestamp added = 4;
  string last_error = 5;
}

// Case is something the rules can't settle (dispatch.Case).
message Case {
  string id = 1;   // kind|repo|check
  string kind = 2; // open set: shared_failure
  string repo = 3;
  string check = 4;
  CaseFacts facts = 5;
  Decision decision = 6; // the live decision; unset when undecided
  bool supervising = 7;  // a supervisor run is looking at it
  Proposal proposal = 8; // a proposal waiting for you
  // pr: a review_reply case's PR, whose review threads wait on you; its
  // proposal's decision (kind answer) carries the drafted replies.
  int64 pr = 9;
}

// CaseFacts are what a case looked like.
message CaseFacts {
  repeated int64 prs = 1;
  bool on_base = 2;
  string base_oid = 3;
  string stamp = 4; // review_reply: the PR's head, updated time and open threads
}

// Decision settles a case (dispatch.Decision).
message Decision {
  string case_id = 1;
  string kind = 2; // open set: link_fix, escalate, answer
  int64 fix_pr = 3;
  string summary = 4;
  repeated string options = 5;
  string by = 6;
  CaseFacts facts = 7;
  google.protobuf.Timestamp decided = 8;
  repeated ReviewReply replies = 9; // answer: the drafted replies
}

// ReviewReply is a reply the supervisor drafted to a review thread; it's
// posted as you only when you approve the proposal.
message ReviewReply {
  string thread = 1;       // the review thread's node id
  string last_comment = 2; // the comment it answers
  string path = 3;
  int64 line = 4;
  string author = 5; // who wrote that comment
  string quote = 6;  // that comment, clipped
  string url = 7;    // that comment's URL
  string body = 8;   // the draft
}

// Proposal is the supervisor agent's answer to a case.
message Proposal {
  string id = 1;
  Decision decision = 2;
  string status = 3; // open set: pending, approved, rejected, applied, refused
  google.protobuf.Timestamp created = 4;
  bool no_answer = 5;
  string note = 6;
  string log = 7; // the run's output file on the hub's machine
}

// Epic is an enrolled epic (epic.Epic).
message Epic {
  string ref = 1;
  string url = 2;
  string title = 3;
  google.protobuf.Timestamp enrolled = 4;
  string state = 5; // open set: reading, planned, approved, error, closed
  string error = 6;
  EpicPlan plan = 7;
  google.protobuf.Timestamp approved = 8; // unset until approved
  string approved_plan = 9;
  google.protobuf.Timestamp checked_at = 10;
  string log = 11; // the planner run's output on the hub's machine
  repeated EpicReport reports = 12; // the latest report of each piece whose run left no PR
  EpicPlan approved_snapshot = 13; // the plan you approved (unset before one is)
  // What the plan changed from the approved one, one line each, while it
  // waits for approval again: show them next to Approve Plan.
  repeated string changes = 14;
  string status_comment = 15; // node ID of gh-hud's progress comment on the epic
  string status_hash = 16;
  // Every piece of the approved plan is done or dropped (gh-hud#22): when
  // that was first seen (unset while one isn't), and the comment
  // FinishEpic posts as it closes the epic. Show it next to Finish Epic.
  google.protobuf.Timestamp complete = 17;
  string summary = 18;
  string summary_comment = 19; // node ID of the summary once posted
  // When gh-hud saw the epic issue closed (state "closed"), and how:
  // "finished by gh-hud" or "closed on GitHub".
  google.protobuf.Timestamp closed = 20;
  string closed_note = 21;
  // The label holding the whole epic (the hold or human-gate label on the
  // epic issue): none of its pieces start while it's there. "" for none.
  string held = 22;
  // runs: how many runs its pieces started since the plan was approved;
  // run_budget: how many they get ([epics] max_total_runs; 0: no limit).
  // When runs reaches run_budget no piece starts until you approve the
  // plan again.
  int64 runs = 23;
  int64 run_budget = 24;
}

// EpicReport is what a piece's run that left no PR did, and the
// supervisor's verdict on it (epic.Report).
message EpicReport {
  string piece = 1;
  string run_id = 2;
  string on = 3; // where it ran
  string status = 4; // open set: ok, failed, left-work, unknown
  google.protobuf.Timestamp finished = 5;
  string summary = 6; // the agent's last message, clipped
  string reason = 7;
  string verdict = 8; // open set: "" (reviewing), retry, human, unreviewed
  string why = 9;
  string hint = 10;
  string log = 11; // the review's log on the hub's machine
}

// EpicPlan is an epic read as a graph.
message EpicPlan {
  string id = 1;
  repeated string sources = 2; // open set: prose, blocked_by, sub_issues
  repeated EpicNode nodes = 3;
  repeated string rules = 4;
  repeated string skipped = 5;
  google.protobuf.Timestamp created = 6;
  string body_hash = 7;
  bool stale = 8;
  // The epic's GitHub sub-issues the plan was read with (owner/repo#N),
  // each a piece (gh-hud#22); a change to them makes the plan stale.
  repeated string sub_issues = 9;
}

// EpicNode is one piece of an epic.
message EpicNode {
  string ref = 1;
  string title = 2;
  string phase = 3;
  repeated string after = 4;
  string gate = 5;
  string source = 6;
  string state = 7; // open set: done, dropped, in_progress, running, ready, waiting, gated, blocked, unknown
  string note = 8;
  int64 pr = 9;
  bool cleared = 10; // you cleared its gate
  // labels: the piece's GitHub labels as of the epic's last status check;
  // labels_known says that check read them (placement by label).
  repeated string labels = 11;
  bool labels_known = 12;
  // area: the paths (in its repo) the planner expects the piece to change;
  // pieces whose areas overlap run one at a time.
  repeated string area = 13;
}

// CheckoutHealth is whether a ghws checkout can take a dispatch.
message CheckoutHealth {
  string machine = 1;
  string workspace = 2;
  string repo = 3;
  string dir = 4;
  string branch = 5;
  string default_branch = 6;
  int64 ahead = 7; // -1 unknown
  int64 behind = 8; // -1 unknown
  repeated string dirty = 9;
  int64 learnings = 10;
  repeated string local_only = 11;
  int64 stashes = 12;
  string busy = 13;
  bool no_upstream = 14;
  string error = 15;
  // Dewey index health: "" not read, "none" not a vault, "ok",
  // "unchecked" (dewey status not read since the index was built),
  // "reindex needed: <reasons>", "check failed: …", "machine problem: …"
  // (joined with "; "). The reasons are "unindexed", "no embeddings" and
  // Dewey's own reindexReasons (#138). A reindex need doesn't make the
  // checkout unready.
  string index = 16;
  google.protobuf.Timestamp index_built = 17; // graph.db mtime; unset = no index
  // From dewey status, as of index_status_at (unset = never read).
  int64 index_pages = 18;
  int64 index_blocks = 19;
  int64 index_embeddings = 20;
  google.protobuf.Timestamp index_status_at = 21;
  // gh-hud is reindexing the checkout's Dewey index: it takes no dispatch.
  bool reindexing = 22;
  ReindexResult last_reindex = 23; // unset: none recorded
  // gh-hud is keeping the checkout up (fetch, fast-forward): it takes no
  // dispatch.
  bool upkeeping = 24;
  UpkeepResult last_upkeep = 25; // unset: none yet
  // The Dewey version and index format the index records (dewey status,
  // as of index_status_at): "" and 0 for an index built before Dewey
  // 3.9.0 recorded them.
  string index_dewey_version = 26;
  int64 index_format = 27;
  // index's reindex reasons as a list (Dewey's contain commas).
  repeated string index_reasons = 28;
  // Not a checkout: a worker's ghws root (dir) whose last_upkeep is its
  // last removal of what isn't the fleet's ([[machines]] remove_unmanaged).
  bool unmanaged = 29;
  // A fleet org's plain ghws dir on a worker (not an org@label instance):
  // ghws clones new instances from it, so upkeep keeps it current, but no
  // run ever starts here. Never ready; its state is "upkeep only" when
  // nothing else stands out.
  bool upkeep_only = 30;
}

// UpkeepResult is the last upkeep of an idle fleet checkout: fetched,
// then fast-forwarded only.
message UpkeepResult {
  google.protobuf.Timestamp at = 1;
  bool report = 2; // [upkeep] mode report: did is what it would do
  string default_branch = 3;
  int64 behind = 4; // the default branch vs the remote's, after the fetch
  int64 ahead = 5;
  repeated string did = 6; // what it changed (or would change)
  repeated string left = 7; // what keeps it from current, left alone
  string skipped = 8; // why it didn't run
  string error = 9; // why it failed
}

// ReindexResult is the outcome of an automatic Dewey reindex of a checkout.
message ReindexResult {
  google.protobuf.Timestamp at = 1; // when it ended
  google.protobuf.Duration duration = 2;
  string binary = 3;
  repeated string reasons = 4; // why it ran
  string skipped = 5; // why it didn't run ("dewey.lock held")
  string error = 6; // why it failed
  // What the index records after the reindex (one dewey status read);
  // "" and 0 when it couldn't be read.
  string dewey_version = 7;
  int64 index_format = 8;
}

message FleetSnapshot {
  string target = 1;
  string target_short = 2;
  string ci = 3; // unknown, green, pending, failed, "no checks"
  string ci_detail = 4;
  bool blocked = 5;
  bool paused = 6;
  bool active = 7;
  string failed = 8;
  string banner = 9;
  string last_error = 10;
  repeated FleetMachine machines = 11;
}

message FleetMachine {
  string name = 1;
  string state = 2;
  bool reachable = 3;
  string applied = 4;
  string applied_short = 5;
  google.protobuf.Duration waited = 6; // time spent draining
  string last_error = 7;
  // The machine's Dewey reindex after this rollout changed its Dewey
  // binary: vaults handled so far and in all (state "reindexing" shows
  // them as "reindexing 7/15"), the vaults that failed or were skipped
  // ("<dir>: <why>"), and a summary ("" when the pin didn't change).
  int32 reindex_done = 8;
  int32 reindex_total = 9;
  repeated string reindex_failures = 10;
  string reindex_note = 11;
  DeweyPass dewey_pass = 12; // unset: no pass asked for since the hub started
  // The vaults the rollout's check found up to date (#138): nothing to
  // reindex.
  repeated string reindex_current = 13;
  // What pruning unused tool versions did after the machine's last
  // verified apply (gh-hud#86): "mise prune: removed 12 versions, freed
  // 2.7 GB"; "" when none ran since the hub started.
  string prune_note = 14;
}

// DeweyPass is a machine's latest "reindex the vaults now" pass (#139).
message DeweyPass {
  bool running = 1;
  int32 done = 2; // vaults handled so far (reindexed, skipped or failed)
  int32 total = 3;
  int32 reindexed = 4;
  repeated string skipped = 5; // "<dir>: <why>": busy, so it didn't start
  repeated string failed = 6; // "<dir>: <why>": it ran and failed
  string note = 7; // the summary ("reindexed 10/12, 1 skipped, 1 failed")
  google.protobuf.Timestamp started = 8;
  google.protobuf.Timestamp ended = 9; // unset while it runs
  repeated string current = 10; // vaults whose check found them up to date
  bool forced = 11; // every vault reindexed, unchecked
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_NOTICE = 1; // a status-line message
  EVENT_KIND_ALERT = 2; // something worth interrupting you for
}

message Event {
  EventKind kind = 1;
  string text = 2;
  Alert alert = 3; // EVENT_KIND_ALERT
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_READY = 1; // your PR is ready for a maintainer
  ALERT_TYPE_BLOCKED = 2; // an agent has waited on you too long
  ALERT_TYPE_RUN_FINISHED = 3;
  ALERT_TYPE_TOOL_RELEASE = 4; // a tool released; its rollout waits for you (ref is tool@version)
  ALERT_TYPE_TOOLKIT_TARGET = 5; // a repo in a tool rollout waits for you: held, refused, failed or CI failing (ref is its PR's owner/repo#N, else tool@version)
  ALERT_TYPE_REINDEX_FAILED = 6; // an automatic Dewey reindex of a checkout failed (ref is [machine:]workspace)
  ALERT_TYPE_UPKEEP_FAILED = 7; // a fleet checkout's upkeep failed, e.g. backing up to the fork (ref is [machine:]workspace/repo)
}

message Alert {
  AlertType type = 1;
  string ref = 2;
  Run run = 3; // run alerts
  Session session = 4; // blocked alerts
  string text = 5;
}

// ToolkitSnapshot is the tools the fleet pins and their rollouts.
message ToolkitSnapshot {
  repeated ToolkitTool tools = 1;
  repeated ToolkitRolloutState rollouts = 2; // newest first
  google.protobuf.Timestamp checked_at = 3;
  bool checking = 4;
  string error = 5; // the manifest or the dotfiles couldn't be read
}

message ToolkitTool {
  string name = 1;
  string release = 2; // the GitHub repo that publishes releases
  string pin = 3; // on the dotfiles branch
  string applied = 4; // on the hub's machine
  string latest = 5; // the newest release
  bool scaffolds = 6; // has an init that writes into repos
  repeated ToolkitRepo repos = 7;
  string error = 8;
}

message ToolkitRepo {
  string target = 1;
  string version = 2; // newest scaffolded; "" when never
  string error = 3;
}

message ToolkitRolloutState {
  string id = 1;
  string tool = 2;
  string version = 3;
  string from = 4;
  string stage = 5; // proposed, pin, scaffold, track, done, failed, cancelled
  google.protobuf.Timestamp started = 6;
  google.protobuf.Timestamp updated = 7;
  string pin_pr = 8;
  string pin_state = 9;
  bool applied = 10;
  repeated ToolkitTarget targets = 11;
  string error = 12;
  string summary = 13; // progress on one line
  string notes = 14; // the release's notes (proposals)
  string notes_url = 15; // the release's page (proposals)
}

message ToolkitTarget {
  string target = 1;
  string status = 2;
  string detail = 3;
  string url = 4;
  string branch = 5;
  string base = 6;
  bool held = 7;
  string pr_state = 8;
  string ci = 9;
  int32 files = 10;
  string needs_you = 11;
}
