name: Android app

# Builds the Android app, lints it and runs its JVM tests. Runs when the
# app or the API it speaks changes. Device tests need a phone or an
# emulator and run locally (make android-device-test).
on:
  push:
    branches: [master]
    paths: ["android/**", "proto/**", "mise.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "proto/**", "mise.toml", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The JDK and SDK command-line tools pinned in mise.toml, as locally.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: java android-sdk
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Accept the Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Lint, test and build
        run: cd android && ./gradlew --console=plain lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-hud-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
