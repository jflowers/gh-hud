name: Release

# Run from master with the version tag (don't push tags yourself):
#
#   gh workflow run release.yml -f tag=v0.4.0
#
# The tag, the checks before it and the Mac app come from jflowers/ship's
# shared workflows:
#
# - tag-release.yml: the run is on master; org-infra's preflight checks the
#   tag (semver, new, newer than the last), that CI passed on HEAD and that
#   there are unreleased commits, then creates the tag; the GitHub release
#   is created with generated notes.
#
# - mac-app-release.yml: the Mac app, built for Apple silicon and Intel,
#   signed with the Developer ID, notarized and stapled, uploaded as
#   gh-hud-app_VERSION.zip, and published to the Homebrew tap (not for a
#   prerelease tag), so any Mac installs and upgrades it with:
#
#     brew install --cask jflowers/tools/gh-hud
#     brew upgrade --cask gh-hud
#
# - The Android app, built here: gh-hud-VERSION.apk, signed with the release
#   key, for any phone or tablet (Android 10 or later). Every release has
#   the same key, so installing a newer APK updates it.
#
# Secrets (ship's scripts/secrets-sync.sh sets them):
#   MACOS_SIGN_P12, MACOS_SIGN_PASSWORD   the Developer ID Application
#                                         certificate and key, base64 .p12
#   MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
#                                         an App Store Connect API key
#                                         (base64 .p8) for notarytool
#   HOMEBREW_TAP_TOKEN                    can push to jflowers/homebrew-tools
#   ANDROID_KEYSTORE                      the release key's keystore, base64 .jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.4.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/tag-release.yml@74ed8075d5c25389bf4d2b775fa52214bed8d5b7 # v0.7.0
    with:
      tag: ${{ inputs.tag }}
      # The required checks. Mac app, Android app and the macOS test run
      # only on some changes, or queue too long on hosted macOS runners.
      ci_checks: '["Lint", "Test (ubuntu-latest)", "Vulnerabilities"]'
    permissions:
      contents: write
      checks: read

  mac-app:
    name: Mac app
    needs: release
    if: needs.release.outputs.tag != ''
    uses: jflowers/ship/.github/workflows/mac-app-release.yml@74ed8075d5c25389bf4d2b775fa52214bed8d5b7 # v0.7.0
    with:
      tag: ${{ needs.release.outputs.tag }}
      checks: make mac-check
      # Ad hoc signed; ship signs it with the Developer ID.
      build: make mac MAC_VERSION="$VERSION" MAC_ARCHS="arm64 x86_64"
      app: build/gh-hud.app
      tap: jflowers/homebrew-tools
      cask_desc: Dashboard for GitHub work and coding agents, a client of the gh-hud hub
      macos: sonoma
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      contents: write

  android-app:
    name: Android app
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads to the release
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      # The JDK and SDK command-line tools pinned in mise.toml, as locally.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: java android-sdk
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      # Installing the SDK packages also accepts the Android SDK license,
      # which the build needs before it will download anything itself.
      - name: SDK packages
        run: make android-sdk

      - name: Build and sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE isn't set; see the top of release.yml"; exit 1; }
          export ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks
          echo -n "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE"
          make android-release ANDROID_VERSION="${TAG#v}"
          rm "$ANDROID_KEYSTORE"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/gh-hud-${TAG#v}.apk" --repo "$GITHUB_REPOSITORY" --clobber
