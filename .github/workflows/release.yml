name: Release

# Pushing a tag (v0.2.0) makes a GitHub release with the apps:
#
# - The Mac app, built for Apple silicon and Intel, signed with the
#   Developer ID, notarized and stapled, and published to the Homebrew tap,
#   so any Mac installs and upgrades it with:
#
#     brew install --cask jflowers/tools/gh-hud
#     brew upgrade --cask gh-hud
#
# - The Android app, gh-hud-VERSION.apk, signed with the release key, for
#   any phone or tablet (Android 10 or later) to download and install.
#   Every release has the same key, so installing a newer APK updates it.
#
# Secrets for the Mac app (the same ones get-out's release uses):
#   MACOS_SIGN_P12, MACOS_SIGN_PASSWORD   the Developer ID Application
#                                         certificate and key, base64 .p12
#   MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
#                                         an App Store Connect API key
#                                         (base64 .p8) for notarytool
#   HOMEBREW_TAP_TOKEN                    can push to jflowers/homebrew-tools
# and for the Android app:
#   ANDROID_KEYSTORE                      the release key's keystore, base64 .jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The release itself, so each app's job only adds its download.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  mac-app:
    name: Mac app
    needs: release
    runs-on: macos-latest
    # The limit counts time spent waiting for a runner and for notarizing.
    timeout-minutes: 60
    permissions:
      contents: write # uploads to the release
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: make mac-check

      - name: Import the Developer ID
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          test -n "$MACOS_SIGN_P12" || { echo "::error::MACOS_SIGN_P12 isn't set; see the top of release.yml"; exit 1; }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -base64 32)
          echo -n "$MACOS_SIGN_P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$id" || { echo "::error::no Developer ID Application identity in MACOS_SIGN_P12"; exit 1; }
          echo "SIGN_ID=$id" >> "$GITHUB_ENV"
          echo -n "$MACOS_NOTARY_KEY" | base64 --decode -o "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          make mac-notarize MAC_SIGN_ID="$SIGN_ID" MAC_VERSION="${VERSION#v}" MAC_ARCHS="arm64 x86_64" \
            MAC_NOTARY_ARGS="--key $RUNNER_TEMP/notary.p8 --key-id $MACOS_NOTARY_KEY_ID --issuer $MACOS_NOTARY_ISSUER_ID"
          lipo -info build/gh-hud.app/Contents/MacOS/GHHud

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "build/gh-hud-app_${VERSION#v}.zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN isn't set; see the top of release.yml"; exit 1; }
          sha=$(shasum -a 256 "build/gh-hud-app_${VERSION#v}.zip" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jflowers/homebrew-tools.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          macos/cask.sh "${VERSION#v}" "$sha" > "$RUNNER_TEMP/tap/Casks/gh-hud.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gh-hud.rb
          git diff --cached --quiet && { echo "the cask is already up to date"; exit 0; }
          git commit -m "gh-hud ${VERSION#v}"
          git push

  android-app:
    name: Android app
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads to the release
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The JDK and SDK command-line tools pinned in mise.toml, as locally.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: java android-sdk
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      # Installing the SDK packages also accepts the Android SDK license,
      # which the build needs before it will download anything itself.
      - name: SDK packages
        run: make android-sdk

      - name: Build and sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE isn't set; see the top of release.yml"; exit 1; }
          export ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks
          echo -n "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE"
          make android-release ANDROID_VERSION="${VERSION#v}"
          rm "$ANDROID_KEYSTORE"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "build/gh-hud-${VERSION#v}.apk" --repo "$GITHUB_REPOSITORY" --clobber
